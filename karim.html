<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<meta name="theme-color" content="#1d3557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" id="favicon" href="data:,">
<style>
  :root {
    --primary: #1d3557; --accent: #e63946;
    --bg: #f5f6f8; --surface: #ffffff; --ink: #17202a; --muted: #66707c; --line: #e3e7ec;
    --veg: #1e8e3e; --nonveg: #c62828; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1318; --surface: #181e26; --ink: #eef1f5; --muted: #9aa5b1; --line: #2a323d; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif; line-height: 1.4; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Hero ---------- */
  .banner { height: 170px; background-size: cover; background-position: center; position: relative;
            background-color: var(--primary); }
  .banner.default {
    background-image:
      radial-gradient(circle at 20% 120%, color-mix(in srgb, var(--accent) 70%, transparent) 0 22%, transparent 23%),
      radial-gradient(circle at 85% -10%, color-mix(in srgb, #fff 14%, transparent) 0 26%, transparent 27%),
      linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 70%, #000));
  }
  .tablepill { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.55); color: #fff;
               padding: 6px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600; backdrop-filter: blur(6px); }
  .brand { max-width: 760px; margin: -44px auto 0; padding: 0 16px; display: flex; gap: 14px; align-items: flex-start; position: relative; }
  .brand > div:last-child { margin-top: 50px; min-width: 0; }
  .logo { width: 88px; height: 88px; border-radius: 22px; border: 4px solid var(--bg); background: var(--accent);
          color: #fff; display: grid; place-items: center; font-size: 2rem; font-weight: 800; overflow: hidden; flex: none; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .brand h1 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.15; }
  .brand p { margin: 0 0 6px; color: var(--muted); font-size: .92rem; }
  .info { max-width: 760px; margin: 14px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .info a, .info span { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
          background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: .88rem; }
  .info a:hover { border-color: var(--accent); }

  /* ---------- Sticky bar ---------- */
  .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
         backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-top: 14px; }
  .bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; }
  .search-row { display: flex; gap: 8px; }
  .search-row input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
                      background: var(--surface); color: var(--ink); font-size: 1rem; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px;
          border-radius: 12px; font-size: .88rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { background: var(--veg); border-color: var(--veg); color: #fff; }
  .diet { display: flex; gap: 8px; margin-top: 8px; }
  .diet button { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 7px; padding: 8px 10px;
         border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 650; font-size: .9rem; }
  .diet button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .diet button[aria-pressed="true"] .dot { background: #fff; border-color: currentColor; }
  .tabs { display: flex; gap: 14px; overflow-x: auto; margin-top: 10px; padding: 2px 2px 6px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 62px; text-decoration: none;
            color: var(--muted); font-size: .72rem; font-weight: 700; white-space: nowrap; }
  .tabs a .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem;
                border: 2px solid transparent; transition: transform .15s; }
  .tabs a.on { color: var(--ink); }
  .tabs a.on .ic { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 4px 12px rgba(0,0,0,.15); }

  /* ---------- Menu ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 4px 16px 10px; }
  h2 { margin: 24px 0 12px; font-size: 1.2rem; scroll-margin-top: 190px; display: flex; align-items: center; gap: 8px; }
  h2 .hi { font-size: 1.4rem; }
  .item { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line);
          border-radius: 18px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(20,30,50,.05); }
  .info-col { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 1.02rem; display: flex; align-items: flex-start; gap: 8px; line-height: 1.25; }
  .name .dot { margin-top: 2px; }
  .dot { width: 15px; height: 15px; border: 2px solid; border-radius: 3px; display: inline-grid; place-items: center; flex: none; }
  .dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dot.veg { color: var(--veg); } .dot.nonveg { color: var(--nonveg); }
  .price { font-weight: 800; margin: 6px 0 4px; font-size: 1rem; }
  .desc { color: var(--muted); font-size: .84rem; }
  .pic { position: relative; width: 112px; height: 104px; margin-bottom: 14px; border-radius: 16px; flex: none;
         background: linear-gradient(145deg, var(--g1), var(--g2)); display: grid; place-items: center; }
  .pic .em { font-size: 3.2rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
  .pic [data-ctl] { display: contents; }
  .add { border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); padding: 6px 24px;
         border-radius: 10px; font-weight: 800; letter-spacing: .3px; }
  .qty { display: inline-flex; align-items: center; gap: 4px; background: var(--accent); color: #fff; border-radius: 10px; padding: 2px; }
  .qty button { width: 32px; height: 30px; border: 0; background: transparent; color: #fff; font-size: 1.2rem; font-weight: 700; }
  .qty b { min-width: 22px; text-align: center; }
  .pic .add, .pic .qty { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); box-shadow: 0 6px 14px rgba(0,0,0,.22); }
  .mini { font-size: 1.3rem; }
  footer { max-width: 760px; margin: 0 auto; padding: 8px 16px 150px; text-align: center; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--ink); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .msg { text-align: center; color: var(--muted); padding: 48px 10px; }

  /* ---------- Cart bar + sheet ---------- */
  #cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
             display: none; }
  #cartbar button { width: 100%; max-width: 728px; margin: 0 auto; display: flex; justify-content: space-between;
             padding: 15px 18px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
             font-weight: 700; font-size: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: none; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 90vh; overflow-y: auto; display: none;
           background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
           max-width: 760px; margin: 0 auto; }
  body.open #backdrop, body.open #sheet { display: block; }
  .sh-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sh-head h3 { margin: 0; font-size: 1.2rem; }
  .x { border: 0; background: var(--bg); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line .nm { flex: 1; min-width: 0; font-size: .95rem; }
  .line .amt { min-width: 70px; text-align: right; font-weight: 650; }
  .bill { margin: 12px 0; font-size: .95rem; }
  .bill div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
  .bill .tot { color: var(--ink); font-weight: 800; font-size: 1.15rem; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; }
  .seg { display: flex; gap: 8px; margin: 12px 0 8px; }
  .seg button { flex: 1; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; }
  .seg button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: #fff; }
  .field { margin: 8px 0; }
  .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--bg); color: var(--ink); font: inherit; }
  .err { color: var(--nonveg); font-size: .85rem; margin: 4px 0 0; min-height: 1.1em; }
  #send { width: 100%; margin-top: 10px; padding: 15px; border: 0; border-radius: 14px; background: #1faa59; color: #fff; font-weight: 800; font-size: 1.02rem; }
  .fine { text-align: center; color: var(--muted); font-size: .78rem; margin: 8px 0 0; }
</style>
</head>

<div class="banner" id="banner"><span class="tablepill" id="tablePill" hidden></span></div>

  <div class="logo" id="logo"></div>

<main id="menu"><div class="msg">Loading menu...</div></main>

      start_url: location.origin + location.pathname, scope: location.origin + "/",
      display: "standalone", background_color: "#f5f6f8", theme_color: CONFIG.primaryColor,
      icons: [{ src: i192, sizes: "192x192", type: "image/png", purpose: "any" },
              { src: i512, sizes: "512x512", type: "image/png", purpose: "any" }]
    };
    setLink("manifest", URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" })));
  } catch (e) { /* icon na bane to bhi menu chalega */ }
}
document.getElementById("favicon").href = DEFAULT_LOGO;
logoImg.onload = () => setupApp(logoImg);
logoImg.src = CONFIG.logo || DEFAULT_LOGO;
logo.appendChild(logoImg);

$("#credit").innerHTML = `Developed by <b>${esc(CONFIG.developer)}</b><br><a href="mailto:${esc(CONFIG.developerEmail)}">${esc(CONFIG.developerEmail)}</a>`;

if (tableNo) { const p = $("#tablePill"); p.hidden = false; p.textContent = "Table " + tableNo; }

const tel = CONFIG.phone.replace(/[^\d+]/g, "");
const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.name + " " + CONFIG.address);
$("#infoRow").innerHTML =
  (CONFIG.phone ? `<a href="tel:${esc(tel)}">📞 ${esc(CONFIG.phone)}</a>` : "") +
  (CONFIG.address ? `<a href="${maps}" target="_blank" rel="noopener">📍 ${esc(CONFIG.address)}</a>` : "") +
  (CONFIG.hours ? `<span>🕒 ${esc(CONFIG.hours)}</span>` : "");

/* ---- CSV ---- */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false; else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = ""; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim()))
             .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

async function load() {
  let text = SAMPLE;
  if (CONFIG.sheetCsvUrl) {
    try {
      const res = await fetch(CONFIG.sheetCsvUrl, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      text = await res.text();
    } catch (e) {
      $("#menu").innerHTML = '<div class="msg">Menu load nahi ho paya. Thodi der baad try karein.</div>';
      return;
    }
  }
  items = parseCSV(text).filter(r => r.name && (r.available || "yes").toLowerCase() !== "no")
    .map((r, i) => ({ id: i, category: r.category || "Menu", name: r.name, price: Number(r.price) || 0,
      veg: (r.veg || "").toLowerCase().replace(/[^a-z]/g, "") !== "nonveg", desc: r.description || "", img: r.image || "" }));
  render();
}

/* ---- Menu render ---- */
/* ---- Dish images (emoji illustrations) + category icons ---- */
const GRADS = [["#ffd9d2","#ffb3a3"],["#d5f2de","#a3e0b8"],["#ffeab3","#ffd073"],["#d6e4ff","#a9c5ff"],["#ecd9ff","#d1adff"],["#c9f1ec","#8fdfd3"]];
const TINTS = ["#ffe0dc","#dcf3e4","#fff0c2","#dde8ff","#efe0ff","#d3f3ee"];
const hash = str => [...str].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const DISH_EMOJI = [
  [/biryani|pulao/i,"🍛"],[/ice ?cream|kulfi/i,"🍨"],[/gulab|jamun|rasgulla|kheer|halwa|sweet|brownie|cake/i,"🍮"],
  [/tikka|kebab|seekh|tandoori|tangdi/i,"🍢"],[/prawn|shrimp/i,"🍤"],[/fish|amritsari|seafood/i,"🐟"],
  [/mutton|lamb|rogan|keema|gosht/i,"🍖"],[/chicken|butter chicken|65/i,"🍗"],[/egg|anda|omelette/i,"🥚"],
  [/paneer|cheese/i,"🧀"],[/dal|lentil|rajma|chole|sambar/i,"🥣"],[/naan|roti|paratha|kulcha|bread/i,"🥙"],
  [/rice|jeera|khichdi/i,"🍚"],[/chai|tea|coffee/i,"☕"],[/chaas|lassi|soda|juice|shake|lime|cola|water|drink/i,"🥤"],
  [/roll|wrap|burger|sandwich/i,"🌯"],[/pizza/i,"🍕"],[/pasta|noodle|chowmein|manchurian/i,"🍜"],[/momo/i,"🥟"],
  [/soup/i,"🍲"],[/fries|chips|pakora/i,"🍟"],[/salad|veg|sabzi|sabji/i,"🥗"]
];
const CAT_EMOJI = [[/starter|snack|appetiz/i,"🍢"],[/main|curry|gravy/i,"🍛"],[/bread|roti|naan/i,"🥙"],[/rice|biryani/i,"🍚"],
  [/dessert|sweet/i,"🍮"],[/drink|beverage|juice|shake/i,"🥤"],[/soup/i,"🍲"],[/pizza|burger|fast/i,"🍕"]];
function emojiFor(i) {
  for (const [re, e] of DISH_EMOJI) if (re.test(i.name)) return e;
  for (const [re, e] of CAT_EMOJI) if (re.test(i.category)) return e;
  return "🍽️";
}
function catEmoji(c) { for (const [re, e] of CAT_EMOJI) if (re.test(c)) return e; return "🍽️"; }

const ctl = id => cart[id]
  ? `<span class="qty"><button data-act="dec" data-id="${id}" aria-label="Remove one">−</button><b>${cart[id]}</b><button data-act="inc" data-id="${id}" aria-label="Add one">+</button></span>`
  : `<button class="add" data-act="inc" data-id="${id}">Add</button>`;

function card(i) {
  const [g1, g2] = GRADS[hash(i.name) % GRADS.length];
  return `<div class="item">
    <div class="info-col">
      <div class="name"><span class="dot ${i.veg ? "veg" : "nonveg"}" title="${i.veg ? "Veg" : "Non-veg"}"></span><span>${esc(i.name)}</span></div>
      <div class="price">${money(i.price)}</div>
      ${i.desc ? `<div class="desc">${esc(i.desc)}</div>` : ""}
    </div>
    <div class="pic" style="--g1:${g1};--g2:${g2}">
      <span class="em" aria-hidden="true">${emojiFor(i)}</span>
      ${i.img ? `<img src="${esc(i.img)}" alt="${esc(i.name)}" loading="lazy" onerror="this.remove()">` : ""}
      <span data-ctl="${i.id}">${ctl(i.id)}</span>
    </div></div>`;
}

let spy;
function render() {
  const list = items.filter(i => (diet === "all" || (diet === "veg") === i.veg) && (!term || (i.name + " " + i.desc).toLowerCase().includes(term)));
  const cats = [...new Set(list.map(i => i.category))];
  $("#tabs").innerHTML = cats.map((c, n) => `<a href="#cat${n}" data-tab="cat${n}"><span class="ic" style="background:${TINTS[n % TINTS.length]}">${catEmoji(c)}</span>${esc(c)}</a>`).join("");
  $("#menu").innerHTML = list.length
    ? cats.map((c, n) => `<section><h2 id="cat${n}"><span class="hi">${catEmoji(c)}</span>${esc(c)}</h2>${list.filter(i => i.category === c).map(card).join("")}</section>`).join("")
    : '<div class="msg">Koi dish nahi mili.</div>';
  if (spy) spy.disconnect();
  spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === e.target.id));
      const on = document.querySelector(".tabs a.on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
    }
  }), { rootMargin: "-200px 0px -70% 0px" });
  document.querySelectorAll("h2").forEach(h => spy.observe(h));
  refreshCartBar();
}

/* ---- Cart + bill ---- */
function bill() {
  const ids = Object.keys(cart);
  const sub = r2(ids.reduce((s, id) => s + cart[id] * items[id].price, 0));
  const g = CONFIG.gst, p = g.enabled ? g.percent : 0;
  let gst = 0, total = sub;
  if (p) {
    if (g.mode === "included") gst = r2(sub - sub / (1 + p / 100));
    else { gst = r2(sub * p / 100); total = r2(sub + gst); }
  }
  const count = ids.reduce((s, id) => s + cart[id], 0);
  return { ids, sub, gst, total, count, p };
}

function chg(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  document.querySelectorAll(`[data-ctl="${id}"]`).forEach(el => el.innerHTML = ctl(id));
  refreshCartBar();
  if (document.body.classList.contains("open")) drawSheet();
}

function refreshCartBar() {
  const b = bill();
  $("#cartbar").style.display = b.count ? "block" : "none";
  $("#openCart").innerHTML = `<span>${b.count} item${b.count > 1 ? "s" : ""} | ${money(b.total)}</span><span>View order</span>`;
  if (!b.count) closeSheet();
}

function billRows(b) {
  const g = CONFIG.gst, inc = g.mode === "included";
  let h = `<div><span>Subtotal</span><span>${money(b.sub)}</span></div>`;
  if (b.p) {
    const half = r2(b.gst / 2), hp = b.p / 2;
    h += g.split
      ? `<div><span>CGST ${hp}%${inc ? " (incl.)" : ""}</span><span>${money(half)}</span></div><div><span>SGST ${hp}%${inc ? " (incl.)" : ""}</span><span>${money(r2(b.gst - half))}</span></div>`
      : `<div><span>GST ${b.p}%${inc ? " (incl.)" : ""}</span><span>${money(b.gst)}</span></div>`;
  }
  return h + `<div class="tot"><span>Total</span><span>${money(b.total)}</span></div>`;
}

function drawSheet() {
  const b = bill();
  $("#sheet").innerHTML = `
    <div class="sh-head"><h3>Your order</h3><button class="x" data-act="close" aria-label="Close">✕</button></div>
    ${b.ids.map(id => `<div class="line"><span class="mini">${emojiFor(items[id])}</span><span class="dot ${items[id].veg ? "veg" : "nonveg"}"></span>
      <span class="nm">${esc(items[id].name)}</span>${ctl(id)}<span class="amt">${money(cart[id] * items[id].price)}</span></div>`).join("")}
    <div class="bill">${billRows(b)}</div>
    <div class="seg">
      <button data-act="type" data-t="dine" aria-pressed="${orderType === "dine"}">Dine-in</button>
      <button data-act="type" data-t="take" aria-pressed="${orderType === "take"}">Takeaway</button>
    </div>
    ${orderType === "dine" ? `<div class="field"><label for="tbl">Table number</label>
      <input id="tbl" inputmode="numeric" maxlength="8" placeholder="e.g. 5" value="${esc(tableNo)}"></div>` : ""}
    <div class="field"><label for="cname">Your name (optional)</label><input id="cname" value="${esc(custName)}"></div>
    <div class="field"><label for="cnote">Note for kitchen (optional)</label>
      <textarea id="cnote" rows="2" placeholder="Less spicy, no onion...">${esc(custNote)}</textarea></div>
    <p class="err" id="err" role="alert"></p>
    <button id="send">Send order on WhatsApp</button>
    <p class="fine">WhatsApp khulega aur order ka message tayyar milega. Bas Send dabayein.</p>`;
}

function openSheet() { drawSheet(); document.body.classList.add("open"); }
function closeSheet() { document.body.classList.remove("open"); }

function sendOrder() {
  tableNo = ($("#tbl")?.value || tableNo).trim();
  custName = $("#cname").value.trim(); custNote = $("#cnote").value.trim();
  if (orderType === "dine" && CONFIG.requireTable && !tableNo) {
    $("#err").textContent = "Table number likhein."; $("#tbl").focus(); return;
  }
  const b = bill(), inc = CONFIG.gst.mode === "included";
  const L = [`*New order | ${CONFIG.name}*`,
    orderType === "dine" ? `Dine-in${tableNo ? " | Table " + tableNo : ""}` : "Takeaway"];
  if (custName) L.push("Name: " + custName);
  L.push("", ...b.ids.map(id => `${cart[id]} x ${items[id].name} = ${money(cart[id] * items[id].price)}`), "");
  L.push(`Subtotal: ${money(b.sub)}`);
  if (b.p) L.push(`GST ${b.p}%${inc ? " (incl.)" : ""}: ${money(b.gst)}`);
  L.push(`*Total: ${money(b.total)}*`);
  if (custNote) L.push("", "Note: " + custNote);
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(L.join("\n"))}`, "_blank");
}

/* ---- Events ---- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (t) {
    const a = t.dataset.act;
    if (a === "inc") chg(+t.dataset.id, 1);
    else if (a === "dec") chg(+t.dataset.id, -1);
    else if (a === "close") closeSheet();
    else if (a === "type") { custName = $("#cname")?.value || custName; custNote = $("#cnote")?.value || custNote;
      tableNo = $("#tbl")?.value ?? tableNo; orderType = t.dataset.t; drawSheet(); }
  }
  if (e.target.id === "send") sendOrder();
  if (e.target.closest("#openCart")) openSheet();
  if (e.target.id === "backdrop") closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#q").oninput = e => { term = e.target.value.trim().toLowerCase(); render(); };
$("#diet").onclick = e => {
  const b = e.target.closest("[data-diet]"); if (!b) return;
  diet = b.dataset.diet;
  document.querySelectorAll("#diet button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};

load();
</script>
